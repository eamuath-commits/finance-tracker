version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=finance_db
      - TZ=Asia/Riyadh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/finance_db
      - TZ=Asia/Riyadh
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./backend:/app

  sms-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
      - backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/finance_db
      - TZ=Asia/Riyadh
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    command: [ "python", "sms_agent.py" ]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
      # Reloads on code change
    environment:
      - TZ=Asia/Riyadh

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token eyJhIjoiODE1YmNmMDJiZDQyMmYxNTZkNzJiYzYzZGRmYjhkODYiLCJ0IjoiMWMwZTlhMjAtNGQ4Zi00ZmMwLWE1OTctYzhhZGE3YWQ3M2M4IiwicyI6Ik9ESTFNVFl4WW1FdE5XSTJZeTAwT0RGbUxXRXlNamt0TldJd1pXWTJNamhoTlRNMSJ9
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
