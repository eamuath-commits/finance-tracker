version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=finance_db
      - TZ=Asia/Riyadh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/finance_db
      - TZ=Asia/Riyadh
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-exp}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./backend:/app

  sms-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
      - backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/finance_db
      - TZ=Asia/Riyadh
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
    command: [ "python", "sms_agent.py" ]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
      # Reloads on code change
    environment:
      - TZ=Asia/Riyadh

volumes:
  postgres_data:
